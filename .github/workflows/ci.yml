name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }} en ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # La app se distribuye en Termux, Linux y Windows; macOS cubre el
        # motor nativo de a-Shell/iOS.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias de prueba
        run: python -m pip install --upgrade pip psutil
      - name: Ejecutar la suite
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Ruff
        run: python -m pip install ruff
      - name: Analizar el código
        run: ruff check .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Analizar los scripts de shell
        # Incluye deploy/termux/launcher, que no tiene extensión .sh.
        run: shellcheck --severity=warning $(git ls-files '*.sh' '*/launcher')
